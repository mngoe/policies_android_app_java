name: develop-comores

on:
  push:
    branches: [ "feature-31770" ]
  pull_request:
    branches: [ "feature-31770" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-disabled: true

      - name: Build release APK
        run: ./gradlew assembleComoresDevDebug
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/comoresDev/debug/app-comoresDev-debug.apk policies-comores-test.apk

      - name: List APK files
        run: ls -l policies-comores-test.apk

      - name: Create a new release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: comores-2
          name:  comores-2
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to release
        uses: softprops/action-gh-release@v1
        with:
          files: policies-comores-test.apk
          tag_name: comores-2
          name: comores-2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}