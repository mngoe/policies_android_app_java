name: CI

on:
  push:
    branches:
      - '*'
#    tags:
#      - '!v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Environment info
        run: |
          gradle --version

      - name: show gradlew permission
        run: |
          chmod +x gradlew

      - name: run units test
        run: |
          ./gradlew testCsuVIHDevDebugUnitTest --stacktrace

      - name: build
        run: |
          ./gradlew assemblecsuVIHDevDebug --stacktrace

