name: CI

on:
  push:
    branches:
      - '*'
#    tags:
#      - '!v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Environment info
        run: |
          gradle --version

      - name: Show Permission
        run: |
          git update-index --chmod=+x ./gradlew


      - name: build
        run: |
          ./gradlew assemblecsuVIHDevDebug --stacktrace

      - name: Environment info
        run: |
          gradle --version

      - uses: actions/upload-artifact@v4
        with:
          name: openimis-policies-apk-${{github.run_number}}.apk
          path: ./app/build/outputs/**/*.apk

      - name: build
        run: |
          ./gradlew bundlecsuVIHDevDebug --stacktrace

      - name: Environment info
        run: |
          gradle --version

      - uses: actions/upload-artifact@v4
        with:
          name: openimis-policies-aab-${{github.run_number}}.aab
          path: ./app/build/outputs/**/*.aab
