name: manualbuild

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Version of application
        required: true
        default: 1.0.0
      release_tag:
        description: Tag to publish update
        required: true
        default: csu-test
# Branch is chosen by default in github manual actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Environment info
        run: |
          gradle --version

      - name: show gradlew permission
        run: |
          chmod +x gradlew

      - name: build
        run: |
          ./gradlew assemblecsuDevDebug --stacktrace
        env:
          APP_VERSION: "${{ github.event.inputs.app_version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: policies-csuTest-${{github.event.inputs.app_version}}
          path: ./app/build/outputs/**/*.apk

      - name: Publish version ${{ github.event.inputs.app_version }} in release ${{ github.event.inputs.release_tag }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }} # Sets the release tag to the pushed tag name (e.g., v1.0.0)
          name: ${{ github.event.inputs.app_version }} # Sets the release name to the pushed tag name (e.g., Release v1.0.0)
          files: ./app/build/outputs/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

