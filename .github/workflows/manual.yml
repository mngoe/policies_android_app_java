name: manualbuild

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Application version
        required: true
        default: 1.0.0
# Branch is chosen by default in github manual actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
#
#      - uses: actions/cache@v4
#        with:
#          path: |
#            ~/.android
#          key: ${{ runner.os }}-${{ github.event.inputs.application_id }}

      - name: Environment info
        run: |
          gradle --version

      - name: show gradlew permission
        run: |
          chmod +x gradlew

      - name: build
        run: |
          ./gradlew assemblecsuVIHDevDebug --stacktrace
        env:
          APP_VERSION: "${{ github.event.inputs.app_version }}"

      - name: Environment info
        run: |
          gradle --version

      - uses: actions/upload-artifact@v4
        with:
          name: policies-csu-vih-${{github.run_number}}.apk
          path: ./app/build/outputs/**/*.apk

#      - name: build
#        run: |
#          ./gradlew bundleDebug --stacktrace
#
#      - uses: actions/upload-artifact@v2
#        with:
#          name: openimis-claims-aab-${{github.run_number}}-${{github.sha}}
#          path: ./claimManagement/build/outputs/**/*.aab